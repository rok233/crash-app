<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crash Stars Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1e293b; border-bottom: 1px solid #334155; }
        .balance { background: #334155; padding: 6px 14px; border-radius: 20px; font-weight: bold; color: #f59e0b; }
        nav { display: flex; background: #1e293b; border-top: 1px solid #334155; }
        nav button { flex: 1; padding: 14px; background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; font-size: 15px; }
        nav button.active { color: #38bdf8; border-top: 2px solid #38bdf8; }
        .tab { display: none; flex: 1; flex-direction: column; padding: 15px; overflow-y: auto; }
        .tab.active { display: flex; }
        .game-card { background: #1e293b; border-radius: 16px; height: 240px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        canvas { position: absolute; width: 100%; height: 100%; }
        .multiplier { font-size: 44px; font-weight: 800; color: #38bdf8; z-index: 2; }
        .status { font-size: 14px; color: #94a3b8; z-index: 2; margin-top: 4px; }
        .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
        .btn { padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-green { background: #22c55e; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-orange { background: #f59e0b; color: #fff; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .card h3 { color: #38bdf8; margin-bottom: 8px; }
    </style>
</head>
<body>
    <header>
        <span id="username">Игрок</span>
        <div class="balance">⭐ <span id="balance">1000</span></div>
    </header>

    <div id="tab-game" class="tab active">
        <div class="game-card">
            <canvas id="canvas"></canvas>
            <div class="multiplier" id="multText">1.00x</div>
            <div class="status" id="statusText">Ожидание раунда...</div>
        </div>
        <div class="controls">
            <input type="number" id="betInput" value="10" placeholder="Ставка монет">
            <button id="actionBtn" class="btn btn-green" onclick="handleAction()">Сделать ставку</button>
        </div>
    </div>

    <div id="tab-profile" class="tab">
        <div class="card">
            <h3>👤 Ваш профиль</h3>
            <p>ID: <span id="userId">---</span></p>
        </div>
        <button class="btn btn-orange" onclick="alert('Пополнение через Telegram Stars')">⭐ Пополнить баланс</button>
    </div>

    <div id="tab-admin" class="tab">
        <div class="card">
            <h3>⚙️ Админ-панель</h3>
            <p>Статус: Активна</p>
            <p>RTP (Отдача): 95%</p>
        </div>
    </div>

    <nav>
        <button class="active" onclick="switchTab('game', this)">🚀 Игра</button>
        <button onclick="switchTab('profile', this)">👤 Профиль</button>
        <button onclick="switchTab('admin', this)">⚙️ Админка</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('userId').innerText = tg.initDataUnsafe.user.id;
        }

        function switchTab(name, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            btn.classList.add('active');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resize); resize();

        let isBet = false, mult = 1.00, timer = null;
        function handleAction() {
            const btn = document.getElementById('actionBtn');
            if (!isBet) {
                isBet = true; btn.innerText = 'ЗАБРАТЬ!'; btn.className = 'btn btn-red';
                startFlight();
            } else {
                isBet = false; clearInterval(timer);
                alert(`🎉 Вы забрали выигрыш на ${mult.toFixed(2)}x!`);
                resetGame();
            }
        }

        function startFlight() {
            mult = 1.00;
            const crashPoint = (Math.random() * 3 + 1.1).toFixed(2);
            timer = setInterval(() => {
                mult += 0.03;
                document.getElementById('multText').innerText = mult.toFixed(2) + 'x';
                document.getElementById('statusText').innerText = 'Ракета летит!';
                draw(mult);
                if (mult >= crashPoint) {
                    clearInterval(timer);
                    document.getElementById('multText').innerText = '💥 CRASH!';
                    document.getElementById('statusText').innerText = 'Взрыв!';
                    draw(mult, true);
                    setTimeout(() => { if (isBet) alert('❌ Перелет!'); resetGame(); }, 1000);
                }
            }, 100);
        }

        function resetGame() {
            isBet = false;
            const btn = document.getElementById('actionBtn');
            btn.innerText = 'Сделать ставку'; btn.className = 'btn btn-green';
        }

        function draw(val, isCrash = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.lineWidth = 4;
            ctx.strokeStyle = isCrash ? '#ef4444' : '#38bdf8';
            ctx.moveTo(10, canvas.height - 10);
            ctx.quadraticCurveTo(canvas.width / 2, canvas.height - 10, Math.min(canvas.width - 10, 10 + val * 30), Math.max(10, canvas.height - 10 - (val * 20)));
            ctx.stroke();
        }
    </script>
</body>
</html>
